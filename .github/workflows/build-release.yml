name: Build Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for testing (e.g., dev)'
        required: false
        default: 'dev'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pyinstaller>=5.0

      - name: Run tests
        run: pytest tests/

      - name: Build with PyInstaller
        run: pyinstaller dice-gui.spec

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r DICE-macOS.zip DICE.app
          rm -rf DICE.app

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version || 'dev' }}" >> $GITHUB_OUTPUT
          fi

      - name: Rename artifact with version
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv dist/DICE.exe "dist/DICE-${VERSION}-Windows.exe"
          elif [ "${{ runner.os }}" == "macOS" ]; then
            mv dist/DICE-macOS.zip "dist/DICE-${VERSION}-macOS.zip"
          else
            mv dist/DICE "dist/DICE-${VERSION}-Linux"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DICE-${{ runner.os }}
          path: dist/DICE-*
          if-no-files-found: error
          retention-days: 5

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DICE-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
