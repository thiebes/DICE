name: Build Release

on:
  release:
    types: [published]
  # Pull requests to main build and smoke-test the binaries on all three
  # operating systems and keep them as workflow artifacts. Only the publish
  # job uploads to a release, and it runs only for release events.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the artifact names (for example, dev)
        required: false
        default: dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request builds are cancelled; release builds never are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Exact interpreter bundled into the binaries. uv downloads it from
  # python-build-standalone and verifies it against its built-in hashes.
  PYTHON_VERSION: "3.12.15"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu runner, so the binary
        # also runs on older distributions: Ubuntu 22.04 has glibc 2.35, and
        # the locked PyQt6 wheels need 2.34.
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Inputs reach the script through environment variables, never through
      # expression interpolation, so they cannot inject shell code.
      - name: Determine version label
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$EVENT_NAME" in
            release) version="${RELEASE_TAG#v}" ;;
            pull_request) version="pr${PR_NUMBER}" ;;
            *) version="${INPUT_VERSION:-dev}" ;;
          esac
          if ! [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Version label '$version' may contain only letters, digits, '.', '_', and '-'"
            exit 1
          fi
          if [ "$EVENT_NAME" = release ]; then
            package_version=$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' dice/__init__.py)
            if [ "$version" != "$package_version" ]; then
              echo "::error::Release tag '$RELEASE_TAG' does not match __version__ '$package_version' in dice/__init__.py"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # uv is pinned to a version whose SHA-256 setup-uv carries in its known
      # list, and the cache is off so a release run cannot restore a cache
      # written by another workflow.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: false

      # See ci.yml for the source of this package list. PyInstaller's Qt hooks
      # import PyQt6 at build time, and the smoke test runs the binary.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils

      - run: uv python install "$PYTHON_VERSION"
        shell: bash

      # The project itself is never installed in this job: PyInstaller bundles
      # it from the source tree, so no unpinned build backend runs here.
      - name: Run tests
        shell: bash
        run: |
          uv sync --locked --no-install-project --extra test --python "$PYTHON_VERSION" --managed-python
          uv run --no-sync python -m pytest --tb=short

      # Sync again without extras so that test packages are removed and not
      # bundled, then add PyInstaller. The final check fails the build if
      # that install changed any package pinned in uv.lock.
      - name: Install build environment
        shell: bash
        run: |
          uv sync --locked --no-install-project --python "$PYTHON_VERSION" --managed-python
          uv pip install --require-hashes -r .github/pyinstaller-requirements.txt
          uv sync --locked --no-install-project --inexact --check --python "$PYTHON_VERSION" --managed-python

      - name: Build with PyInstaller
        run: uv run --no-sync pyinstaller --noconfirm --clean dice-gui.spec

      # Start the binary with the offscreen Qt platform and require it to be
      # running a minute later. A start-up exception ends the process on Linux
      # and macOS.
      - name: Smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            app=dist/DICE.app/Contents/MacOS/DICE
          else
            app=dist/DICE
          fi
          "$app" > smoke.log 2>&1 &
          pid=$!
          sleep 60
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            wait "$pid" || true
            cat smoke.log
            echo "DICE was still running after 60 s"
          else
            status=0
            wait "$pid" || status=$?
            cat smoke.log
            echo "::error::DICE exited during start-up with status $status"
            exit 1
          fi

      # On Windows the windowed build reports a start-up exception in a
      # dialog titled "Unhandled exception in script" and keeps running. With
      # the offscreen Qt platform the application itself opens no visible
      # window, so any visible window means that dialog.
      - name: Smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dist\DICE.exe -PassThru
          $null = $proc.Handle  # keeps the exit code readable after exit
          Start-Sleep -Seconds 60
          $windows = @(Get-Process -Name DICE -ErrorAction SilentlyContinue | Where-Object MainWindowTitle)
          $exited = $proc.HasExited
          Get-Process -Name DICE -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($exited) {
            Write-Output "::error::DICE.exe exited during start-up with code $($proc.ExitCode)"
            exit 1
          }
          if ($windows.Count -gt 0) {
            Write-Output "::error::DICE.exe opened a window titled '$($windows[0].MainWindowTitle)'"
            exit 1
          }
          Write-Output "DICE.exe was still running after 60 s with no visible window"

      # ditto keeps the symbolic links inside the .app bundle, which zip -r
      # would replace with copies.
      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          case "$RUNNER_OS" in
            Windows) mv dist/DICE.exe "release/DICE-${VERSION}-Windows.exe" ;;
            macOS) ditto -c -k --keepParent dist/DICE.app "release/DICE-${VERSION}-macOS.zip" ;;
            Linux) mv dist/DICE "release/DICE-${VERSION}-Linux" ;;
          esac
          ls -l release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DICE-${{ runner.os }}
          path: release/
          if-no-files-found: error
          retention-days: 5

  # Separate from the build so that the write token is never present where
  # project code, its dependencies, or PyInstaller run. It uses the GitHub CLI
  # preinstalled on the runner instead of a third-party release action.
  publish:
    name: Upload to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: DICE-*
          path: release
          merge-multiple: true
      - name: Upload binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd release
          sha256sum DICE-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" DICE-* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
