name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # macOS is tested because a macOS binary is released.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      # Qt runs without a display server on every runner.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
      # Libraries that PyQt6 needs on Ubuntu: the GitHub Actions list from the
      # pytest-qt troubleshooting guide, with the libgl1, libegl1, libdbus-1-3,
      # and libxcb-cursor0 (required since Qt 6.5) that the guide also names,
      # plus libfontconfig1, which libQt6Gui links against. The xcb libraries
      # serve the xcb platform plugin (for example under xvfb); the tests use
      # the offscreen plugin.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils
      - run: uv python install ${{ matrix.python-version }}
      # --python overrides .python-version, which would otherwise select 3.12
      # for every matrix entry. --locked fails if uv.lock is out of date. The
      # webapp extra installs Flask, without which tests/test_webapp.py skips.
      - run: uv sync --locked --extra test --extra webapp --python ${{ matrix.python-version }}
      - name: Run tests with coverage
        run: uv run --no-sync pytest --tb=short --cov=dice --cov=dice_gui --cov-report=term-missing
