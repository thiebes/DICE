version: 2
updates:
  # Keeps the SHA-pinned actions current for runtime deprecations and security
  # fixes. PyInstaller in .github/pyinstaller-requirements.txt is not covered:
  # it is constrained by uv.lock and regenerated by hand (see that file).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release must age before it is proposed, so a release that is
    # malicious from the start has time to be caught upstream.
    cooldown:
      default-days: 7
    groups:
      # When this bumps astral-sh/setup-uv, the uv `version` pinned on its
      # steps can move up to the newest uv in that release's known checksums.
      actions:
        patterns: ["*"]
