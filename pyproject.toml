[project]
name = "dice"
version = "1.3.0"
description = "Diffusion Insight Computation Engine - Monte Carlo simulation tool for quantifying noise effects in optical measures of excited state transport"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC-BY-4.0"}
authors = [
    {name = "Joseph J. Thiebes"}
]
keywords = ["diffusion", "microscopy", "monte-carlo", "simulation", "optoelectronics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "statsmodels>=0.12.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "joblib>=1.0.0",
    "PyQt6>=6.0.0",
]

[project.optional-dependencies]
webapp = [
    "flask>=2.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.0.0",
    "flask>=2.0.0",
]

[project.scripts]
dice = "dice.cli.main:main"
dice-gui = "dice_gui.dice_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dice", "dice_gui"]
